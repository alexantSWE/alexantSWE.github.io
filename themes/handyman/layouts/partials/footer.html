{{/* footer.html — contact bits and a small colophon. */}}
<footer class="site-footer">
  <div class="footer-links">
    <a href="https://t.me/{{ .Site.Params.telegram }}">Telegram</a>
    {{ with .Site.Params.email }}<a href="mailto:{{ . }}">Email</a>{{ end }}
    <a href="https://github.com/{{ .Site.Params.github }}">GitHub</a>
    {{ with .OutputFormats.Get "rss" }}
      <a href="{{ .RelPermalink }}">RSS</a>
    {{ end }}
  </div>
  <p class="colophon">
    <span class="colophon-copy" dir="ltr">© {{ now.Year }} {{ .Site.Title }}</span>
    — {{ i18n "rights" }} · {{ i18n "no_trackers" }}<br>
    {{ i18n "built_with" . }}
  </p>
</footer>
