baseURL = "https://alexantSWE.github.io/"
title = "Alireza Rezaei"
theme = "handyman"

# Persian is home.
defaultContentLanguage = "fa"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
timeZone = "Asia/Tehran"

[pagination]
  pagerSize = 10

# Only tags are used; drop the default `categories` taxonomy.
[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"
    lineNos = false
    noClasses = true

# ---------------------------------------------------------------- languages
[languages]
  [languages.fa]
    locale = "fa-IR"
    label = "فارسی"
    title = "علی‌رضا رضایی"
    contentDir = "content/fa"
    weight = 1
    direction = "rtl"
    [languages.fa.params]
      description = "دست‌به‌کار سیستم و نرم‌افزار — لینوکس، عیب‌یابی، اتوماسیون"

  [languages.en]
    locale = "en-US"
    label = "English"
    title = "Alireza Rezaei"
    contentDir = "content/en"
    weight = 2
    direction = "ltr"
    [languages.en.params]
      description = "OS & software handyman — Linux, troubleshooting, automation"

# ------------------------------------------------------------------- menus
[languages.fa.menus]
  [[languages.fa.menus.main]]
    name = "خانه"
    pageRef = "/"
    weight = 10
  [[languages.fa.menus.main]]
    name = "خدمات"
    pageRef = "/services"
